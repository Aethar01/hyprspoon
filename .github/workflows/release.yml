name: Release

# Pushing a tag like v0.1.0 builds the native modules and attaches the
# Spoon, ready to unzip into ~/.hammerspoon/Spoons, to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hammerspoon
        run: brew install --cask hammerspoon
      - name: Build native modules
        run: |
          make -C hyprspoon/native
          codesign --force --sign - hyprspoon/native/*.so
      - name: Package the Spoon
        run: |
          mkdir -p dist/hyprspoon.spoon
          git archive HEAD | tar -x -C dist/hyprspoon.spoon
          cp hyprspoon/native/*.so dist/hyprspoon.spoon/hyprspoon/native/
          (cd dist && zip -qr hyprspoon.spoon.zip hyprspoon.spoon)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/hyprspoon.spoon.zip --generate-notes
